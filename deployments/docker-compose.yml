# Run from the repository root, via the Makefile: an explicit project name and --project-directory keep
# the container names, build context and .env at the root rather than in this directory.
name: notifications

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: notifications
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-notifications}
      POSTGRES_DB: notifications
    ports:
      # Loopback on purpose: published only so the integration tests can reach it from the host.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notifications -d notifications"]
      interval: 3s
      timeout: 3s
      retries: 10
    volumes:
      - db-data:/var/lib/postgresql/data

  # Stands in for the provider so the stack sends nothing and needs no credentials.
  fake-messagebird:
    build:
      context: .
      dockerfile: build/package/Dockerfile
      target: fake-messagebird
    environment:
      # Anchored rather than repeated, so the service and its provider cannot disagree about the key.
      MESSAGEBIRD_ACCESS_KEY: &messagebird_access_key ${MESSAGEBIRD_ACCESS_KEY:-local-fake-key}

  # Runs once and exits, as a Job or init container would, so replicas never race to migrate.
  migrations:
    build:
      context: .
      dockerfile: build/package/Dockerfile
      target: service
    # entrypoint, not command: the image sets an ENTRYPOINT, and a command would only add arguments.
    entrypoint: ["/usr/local/bin/migrations"]
    depends_on:
      db:
        condition: service_healthy
    environment: &db_env
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: notifications
      DB_PASSWORD: ${POSTGRES_PASSWORD:-notifications}
      DB_NAME: notifications
      DB_SSLMODE: disable
    restart: "no"

  api:
    build:
      context: .
      dockerfile: build/package/Dockerfile
      target: service
    depends_on:
      db:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
      fake-messagebird:
        condition: service_started
    environment:
      <<: *db_env
      HTTP_ADDR: ":8080"
      MESSAGEBIRD_ACCESS_KEY: *messagebird_access_key
      # Point this at https://rest.messagebird.com with a real key to send for real.
      MESSAGEBIRD_BASE_URL: ${MESSAGEBIRD_BASE_URL:-http://fake-messagebird:8099}
      MESSAGEBIRD_ORIGINATOR: ${MESSAGEBIRD_ORIGINATOR:-ACME}
    ports:
      - "8080:8080"

volumes:
  db-data:
